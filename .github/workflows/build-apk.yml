name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["vexora-ai.bin"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q vexora-ai.bin -d src
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          build-root-directory: src/vexora-ai
      - run: gradle :app:assembleDebug -PAPI_URL=${{ vars.API_URL || 'http://10.0.2.2:8000' }}
        working-directory: src/vexora-ai
      - uses: actions/upload-artifact@v4
        with:
          name: vexora-debug-apk
          path: src/vexora-ai/app/build/outputs/apk/debug/*.apk
